<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Operative Builder Trace</title>
<link rel="icon" href="assets/branding/favicon.svg">
<style>
/* Paper, not a console. The loop's own interface is a monospace instrument panel and
   it is right to be; this is the transcript afterwards, and a transcript is for
   reading. One column, two voices, plenty of air, and nothing said twice. */
:root{
  --paper:#f7f6f3; --ink:#1c1b19; --soft:#78746c; --faint:#a8a49b;
  --rule:#e4e1da; --card:#ffffff; --mine:#ebe8e1;
  --alarm:#c0492f; --calm:#5c7a5e;
  --sky-top:#cfd8dd; --sky-bot:#e8e6e0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* `minmax(0,1fr)` on the column, not just `100%`: a grid track is sized to its
   content by default, so one header that would not fit quietly widened the whole
   page, and `right:16px` on the score then measured from an edge off the screen. */
#app{display:grid;height:100%;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,40%) minmax(0,1fr);overflow:hidden}

/* ---------------- header ---------------- */
header{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--rule);
  background:var(--paper);min-width:0;overflow:hidden}
header .name{font-size:13px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
header .sp{flex:1}
header select,header button,header label{font-size:11.5px;color:var(--soft);background:#fff;
  border:1px solid var(--rule);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;
  flex:0 0 auto}
header select{max-width:min(46vw,300px);letter-spacing:0;min-width:0}
.narrow{display:none}

/* ---------------- the model ---------------- */
#stage{position:relative;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#ref{position:absolute;top:16px;left:16px;z-index:5;width:104px}
#ref img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;
  background:#fff;box-shadow:0 1px 3px #0000001f,0 8px 24px #00000014;cursor:zoom-in}
#ref .cap{margin-top:7px}

#meter{position:absolute;top:16px;right:16px;z-index:5;text-align:right}
#score{font-size:40px;line-height:1;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#meter .cap{margin-bottom:3px}
#meterNote{font-size:11px;color:var(--soft);margin-top:4px;letter-spacing:0}

#emptyPlate{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;
  color:var(--faint);z-index:2}
#emptyPlate.on{display:grid}
#emptyPlate b{display:block;font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.04em}
#emptyPlate span{display:block;max-width:280px;margin:6px auto 0;font-size:12px;line-height:1.5}

#bar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:14px;align-items:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(#f7f6f300,#f7f6f3cc 42%,var(--paper));backdrop-filter:blur(6px)}
#bar button.round{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-size:12px;flex:none}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;min-width:40px}
#seek::-webkit-slider-runnable-track{height:2px;background:var(--rule);border-radius:2px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--ink);margin-top:-5.5px}
#seek::-moz-range-track{height:2px;background:var(--rule);border-radius:2px}
#seek::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--ink)}
#tick{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:0}

/* ---------------- the thread ---------------- */
#thread{overflow-y:auto;overscroll-behavior:contain;background:var(--paper);
  border-top:1px solid var(--rule);padding:20px 0 28px;scroll-behavior:smooth}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

.turn{display:flex;margin-bottom:16px;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.turn.right{justify-content:flex-end}
.bub{max-width:76%;padding:12px 15px;border-radius:20px;background:var(--card);
  box-shadow:0 1px 2px #00000010;border:1px solid var(--rule)}
.turn.right .bub{background:var(--mine);border-color:#00000000;box-shadow:none}
.who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.turn.right .who{justify-content:flex-end}
.txt{white-space:pre-wrap;word-break:break-word}
.big{font-size:16px}

.note{text-align:center;font-size:11.5px;color:var(--faint);margin:0 0 16px;letter-spacing:0}
.note b{color:var(--soft);font-weight:500}
.note.warn b{color:var(--alarm)}

.verdict{display:flex;gap:14px;align-items:flex-start}
.verdict .n{font-size:30px;line-height:.95;font-weight:300;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;flex:none;min-width:44px}
.verdict .n small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-top:4px;font-weight:400}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 10px}
.shots figure{margin:0}
.shots img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;
  background:#fff;border:1px solid var(--rule);cursor:zoom-in}
.shots figcaption{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:5px}

.opener .bub{max-width:100%;width:100%;text-align:center;padding:18px 16px 16px}
.opener img{display:block;width:100%;max-width:340px;margin:0 auto 12px;border-radius:12px;
  border:1px solid var(--rule);cursor:zoom-in}
.opener .big{font-weight:500}

.raw{margin-top:9px}
.raw button{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0}
.raw button:hover{color:var(--soft)}
.raw pre{display:none;margin:9px 0 0;padding:11px 12px;background:var(--paper);border:1px solid var(--rule);
  border-radius:11px;font:400 11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;word-break:break-word;color:var(--soft);max-height:280px;overflow:auto;letter-spacing:0}
.raw.on pre{display:block}

.typing .bub{padding:14px 16px}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.25s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:.85}}

/* ---------------- chrome ---------------- */

#lb{position:fixed;inset:0;z-index:60;background:#f7f6f3f2;display:none;place-items:center;
  padding:24px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px #00000022}
#lb b{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:400}

#docs{position:fixed;inset:0;z-index:70;background:var(--paper);display:none;overflow:auto}
#docs.on{display:block}
#docs .wrap{padding:44px 20px 60px}
#docs h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 14px}
#docs h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:34px 0 10px;font-weight:400}
#docs p,#docs li{color:#3a3833;margin:0 0 12px}
#docs pre{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;overflow:auto;
  font:400 11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft);
  white-space:pre-wrap;letter-spacing:0}
#docs a{color:var(--ink)}
#docsClose{position:fixed;top:16px;right:18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--soft);background:#fff;border-radius:99px;padding:8px 14px;box-shadow:0 1px 3px #00000014}

#boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--paper);
  color:var(--faint);font-size:12px;letter-spacing:.1em;text-align:center;padding:24px}

@media(max-width:700px){
  #app{grid-template-rows:auto minmax(0,38%) minmax(0,1fr)}
  /* Everything must fit 390px. Overflowing, the header widened the document, and
     `right:12px` on the score then measured from an edge that was off the screen —
     so the suck score, the one number this page exists to show, was invisible. */
  header{padding:9px 10px;gap:6px}
  header .name{display:none}
  header select,header button,header label{font-size:11px;padding:6px 9px}
  header select{flex:1 1 auto;max-width:none;min-width:0;text-overflow:ellipsis}
  .wide{display:none}.narrow{display:inline}
  #ref{width:76px;top:12px;left:12px}
  #meter{top:12px;right:12px}
  #score{font-size:32px}
  #meterNote{display:none}
  .bub{max-width:86%}
  .wrap{padding:0 14px}
  }
@media(prefers-reduced-motion:reduce){
  .turn{animation:none}.dots i{animation:none;opacity:.5}#thread{scroll-behavior:auto}
}
</style>
</head>
<body>
<div id="boot">reading the trace…</div>

<div id="app">
  <header>
    <span class="name">Operative Builder Trace</span>
    <span class="sp"></span>
    <select id="pick"></select>
    <label><span class="wide">Open a trace</span><span class="narrow">Open</span>
      <input id="file" type="file" accept="application/json" hidden></label>
    <button id="docsBtn"><span class="wide">How to read this</span><span class="narrow">Read me</span></button>
  </header>

  <section id="stage">
    <canvas id="gl"></canvas>

    <div id="ref">
      <img id="refimg" alt="the reference">
      <div class="cap" id="refname">reference</div>
    </div>

    <div id="meter">
      <div class="cap">suck score</div>
      <div id="score">—</div>
      <div id="meterNote">fucked until proven otherwise</div>
    </div>

    <div id="emptyPlate"><div><b>Nothing was built.</b>
      <span>Every operation was rejected, so the captures below are blank. That is the trace being honest, not a fault in this page.</span></div></div>

    <div id="bar">
      <button class="round" id="play">▶</button>
      <input id="seek" type="range" min="0" max="0" value="0">
      <span id="tick">—</span>
    </div>
  </section>

  <section id="thread"><div class="wrap" id="log"></div></section>
</div>

<div id="lb"><b id="lbcap"></b><img id="lbimg" alt=""></div>
<div id="docs"><button id="docsClose">Close</button><div class="wrap" id="docsBody"></div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';

// A trace is one argument: a reference photograph, a BUILDER that may answer only in
// JSON operations, and a CRITIC told the building is fucked until proven otherwise.
// The critic's accusation becomes the builder's next prompt.
//
// Which is why the raw file reads so badly as a conversation: every accusation is in
// it three times — as the critic's verdict, as the bridge that carries it, and again
// inside the next prompt, wrapped in sixteen hundred characters of identical
// boilerplate. Four logs, fifty-four entries, and perhaps twenty things actually
// said. This page says each of them once, and keeps the full text one tap away.

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let idx = null, trace = null, msgs = [], at = 0, playing = false, timer = null;

// ------------------------------------------------------------------ the thread
function thread(t) {
  const out = [{ kind: 'opener', ref: t.reference, intent: t.intent, name: t.reference_name }];
  const T = (s) => (s ? Date.parse(s) : 0);
  const prompts = (t.builder_log || []).filter(b => b.role === 'user');
  const errs = (t.builder_log || []).filter(b => b.role === 'error');

  for (const h of t.history) {
    const ok = (h.receipts || []).filter(r => !/^REJECT/.test(r)).length;
    const no = (h.receipts || []).length - ok;
    // The prompt that opened this cycle, kept whole for anyone who wants it and
    // folded away for everyone else — the only part that ever differs is the
    // accusation, and the critic already said that in its own words.
    const p = prompts.filter(x => T(x.ts) <= T(h.ts)).pop();
    out.push({ kind: 'builder', cycle: h.cycle, text: h.summary || '',
               ops: (h.operations || []).length, ok, no, raw: p ? p.text : null, history: h });
    if (no) out.push({ kind: 'note', warn: true, cycle: h.cycle,
      text: `${no} of ${ok + no} operations rejected — nothing was built` });
    const c = (h.critiques || [])[0];
    if (c) out.push({ kind: 'critic', cycle: h.cycle, score: c.score, text: c.criticism || '',
                      shots: h, view: c.view });
  }
  // The dead connection, said once with a count rather than six identical times.
  if (errs.length) {
    const msg = errs[0].text;
    const anchor = out.map((m, i) => [m, i]).filter(([m]) => m.kind === 'critic').slice(-2)[0];
    const line = { kind: 'note', warn: true,
      text: errs.length > 1 ? `${msg} — the loop retried ${errs.length} times before it caught` : msg };
    out.splice(anchor ? anchor[1] + 1 : out.length, 0, line);
  }
  return out;
}

// ------------------------------------------------------------------ the model
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 900);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9bdb4, 1.25));
const sun = new THREE.DirectionalLight(0xfffaf0, .95); sun.position.set(28, 44, 22); scene.add(sun);
const rim = new THREE.DirectionalLight(0xd7e4f2, .35); rim.position.set(-30, 18, -28); scene.add(rim);
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(600, 600),
  new THREE.MeshBasicMaterial({ color: 0xdedbd4 }));
shadowPlane.rotation.x = -Math.PI / 2; shadowPlane.position.y = -0.05; scene.add(shadowPlane);
const worldGroup = new THREE.Group(), rings = new THREE.Group(); scene.add(worldGroup, rings);

const orbit = { az: -0.72, el: 0.33, dist: 46, target: new THREE.Vector3(0, 3, 0) };
let spin = true, framed = null;

function meshFor(o) {
  const [sx, sy, sz] = o.size || [1, 1, 1];
  let g;
  if (o.primitive === 'cylinder') g = new THREE.CylinderGeometry(sx / 2, sx / 2, sy, 22);
  else if (o.primitive === 'cone') g = new THREE.ConeGeometry(sx / 2, sy, 22);
  else if (o.primitive === 'sphere') g = new THREE.SphereGeometry(sx / 2, 20, 14);
  else if (o.primitive === 'gable') {
    const s = new THREE.Shape();
    s.moveTo(-sx / 2, -sy / 2); s.lineTo(sx / 2, -sy / 2); s.lineTo(0, sy / 2); s.closePath();
    g = new THREE.ExtrudeGeometry(s, { depth: sz, bevelEnabled: false }); g.translate(0, 0, -sz / 2);
  } else g = new THREE.BoxGeometry(sx, sy, sz);
  const metal = o.material === 'metal';
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: new THREE.Color(o.color || '#9aa3ad'), roughness: metal ? .4 : .92, metalness: metal ? .5 : .03 }));
  const [px, py, pz] = o.position || [0, 0, 0];
  m.position.set(px, py, pz); m.rotation.y = o.rotation_y || 0;
  const [ax, ay, az] = o.scale || [1, 1, 1]; m.scale.set(ax, ay, az);
  return m;
}

function drawWorld(h) {
  worldGroup.clear(); rings.clear();
  const objs = (h && h.afterWorld && h.afterWorld.length) ? h.afterWorld : [];
  $('#emptyPlate').classList.toggle('on', !!h && !objs.length);
  if (!objs.length) return;
  const added = new Set((h.diff && h.diff.added) || []);
  const changed = new Set((h.diff && h.diff.changed) || []);
  for (const o of objs) {
    const m = meshFor(o); worldGroup.add(m);
    const col = added.has(o.id) ? 0x2f8f84 : changed.has(o.id) ? 0xb08a2e : null;
    if (col) {
      const hx = new THREE.Box3Helper(new THREE.Box3().setFromObject(m), new THREE.Color(col));
      hx.material.depthTest = false; hx.material.transparent = true;
      hx.material.opacity = .8; hx.renderOrder = 5; rings.add(hx);
    }
  }
  const b = new THREE.Box3().setFromObject(worldGroup);
  if (b.isEmpty()) return;
  orbit.target.copy(b.getCenter(new THREE.Vector3()));
  const s = b.getSize(new THREE.Vector3());
  // A phone is portrait and a castle is wide, so the horizontal fit decides. Held
  // steady across a run and only ever opened out, so the eye watches the castle
  // change rather than the camera move.
  const aspect = Math.max(0.35, camera.aspect || 1);
  const span = Math.max(s.x, s.z);
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const want = Math.max((span / 2) / (half * aspect), (Math.max(s.y, span * .55) / 2) / half) * 1.3 + 6;
  orbit.dist = framed ? Math.max(framed, want) : want; framed = orbit.dist;
}

// ------------------------------------------------------------------ rendering
const scoreInk = (n) => n == null ? 'var(--faint)'
  : n >= 85 ? 'var(--alarm)' : n >= 70 ? '#b4622f' : n >= 50 ? '#8a7a33' : 'var(--calm)';

function bubble(m, i) {
  if (m.kind === 'opener') return `
    <div class="turn opener" data-i="${i}"><div class="bub">
      <img src="${m.ref}" data-cap="the reference" alt="the reference">
      <div class="cap">build this</div>
      <div class="big" style="margin-top:5px">${esc(m.intent)}</div>
    </div></div>`;

  if (m.kind === 'note') return `
    <div class="note ${m.warn ? 'warn' : ''}" data-i="${i}"><b>${esc(m.text)}</b></div>`;

  if (m.kind === 'critic') {
    const h = m.shots;
    const shots = ['beforeShot', 'afterShot', 'diffShot'].filter(k => h && h[k]);
    const caps = { beforeShot: 'before', afterShot: 'after', diffShot: 'what changed' };
    // A capture of an empty world is a white rectangle. Left uncaptioned it reads as
    // a broken image when it is in fact the point.
    const blank = { beforeShot: h && !(h.beforeWorld || []).length,
                    afterShot: h && !(h.afterWorld || []).length,
                    diffShot: h && !(h.afterWorld || []).length };
    return `
    <div class="turn" data-i="${i}"><div class="bub">
      <div class="who"><span>critic</span><span>cycle ${m.cycle}</span></div>
      ${shots.length ? `<div class="shots">${shots.map(k =>
        `<figure><img src="${h[k]}" data-cap="${caps[k]} · cycle ${m.cycle}" alt="${caps[k]}">
           <figcaption>${caps[k]}${blank[k] ? ' · blank' : ''}</figcaption></figure>`).join('')}</div>` : ''}
      <div class="verdict">
        <div class="n" style="color:${scoreInk(m.score)}">${m.score}<small>suck</small></div>
        <div class="txt">${esc(m.text)}</div>
      </div>
    </div></div>`;
  }

  return `
    <div class="turn right" data-i="${i}"><div class="bub">
      <div class="who"><span>cycle ${m.cycle}</span><span>builder</span></div>
      <div class="txt">${esc(m.text)}</div>
      ${m.raw ? `<div class="raw"><button data-raw="${i}">what it was asked</button>
        <pre>${esc(m.raw)}</pre></div>` : ''}
    </div></div>`;
}

function paint() {
  $('#log').innerHTML = msgs.slice(0, at + 1).map((m, i) => bubble(m, i)).join('');
  const cyc = worldFor(at);
  if (cyc !== paint._h) { drawWorld(cyc); paint._h = cyc; }
  const score = lastScore(at);
  $('#score').textContent = score ?? '—';
  $('#score').style.color = scoreInk(score);
  $('#seek').value = String(at);
  $('#tick').textContent = `${at + 1} / ${msgs.length}`;
}
const worldFor = (i) => { for (let k = i; k >= 0; k--) if (msgs[k].history) return msgs[k].history; return null; };
const lastScore = (i) => { for (let k = i; k >= 0; k--) if (msgs[k].kind === 'critic') return msgs[k].score; return null; };

const atBottom = () => {
  const t = $('#thread');
  return t.scrollHeight - t.scrollTop - t.clientHeight < 90;
};
const toBottom = () => { const t = $('#thread'); t.scrollTop = t.scrollHeight; };

/** Reveal the next message the way a message arrives: someone is typing, then it lands. */
async function advance() {
  if (at >= msgs.length - 1) return stop();
  const next = msgs[at + 1];
  const stick = atBottom();
  if (next.kind !== 'note') {
    const side = next.kind === 'builder' ? 'right' : '';
    $('#log').insertAdjacentHTML('beforeend',
      `<div class="turn typing ${side}" id="typing"><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>`);
    if (stick) toBottom();
    await new Promise(r => setTimeout(r, next.kind === 'critic' ? 900 : 700));
    const t = document.getElementById('typing'); if (t) t.remove();
    if (!playing) return;
  }
  at++;
  paint();
  if (stick) toBottom();
}

function show(i) {
  at = Math.max(0, Math.min(msgs.length - 1, i));
  paint(); toBottom();
}

// ------------------------------------------------------------------ transport
function play() {
  playing = true; $('#play').textContent = '❚❚';
  clearInterval(timer);
  timer = setInterval(async () => { if (playing) await advance(); }, 2300);
  advance();
}
function stop() {
  playing = false; $('#play').textContent = '▶'; clearInterval(timer);
  const t = document.getElementById('typing'); if (t) t.remove();
}
$('#play').onclick = () => playing ? stop() : play();
$('#seek').oninput = e => { stop(); show(+e.target.value); };
addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
  if (e.key === 'ArrowRight') { stop(); show(at + 1); }
  if (e.key === 'ArrowLeft') { stop(); show(at - 1); }
});

document.addEventListener('click', e => {
  const raw = e.target.closest('[data-raw]');
  if (raw) { const box = raw.parentElement; box.classList.toggle('on');
    raw.textContent = box.classList.contains('on') ? 'hide' : 'what it was asked'; return; }
  const img = e.target.closest('.shots img, .opener img, #ref img');
  if (img) { $('#lbimg').src = img.src; $('#lbcap').textContent = img.dataset.cap || 'the reference';
    $('#lb').classList.add('on'); return; }
  const turn = e.target.closest('.turn');
  if (turn && !e.target.closest('.raw')) { stop(); show(+turn.dataset.i); }
});
$('#lb').onclick = () => $('#lb').classList.remove('on');
$('#docsBtn').onclick = () => $('#docs').classList.add('on');
$('#docsClose').onclick = () => $('#docs').classList.remove('on');

let drag = null;
const gl = $('#gl');
gl.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; spin = false; gl.setPointerCapture(e.pointerId); });
gl.addEventListener('pointerup', () => { drag = null; });
gl.addEventListener('pointermove', e => { if (!drag) return;
  orbit.az -= (e.clientX - drag.x) * .007;
  orbit.el = Math.max(0, Math.min(1.3, orbit.el + (e.clientY - drag.y) * .006));
  drag = { x: e.clientX, y: e.clientY }; });

function placeCamera() {
  const c = Math.cos(orbit.el);
  camera.position.set(orbit.target.x + orbit.dist * Math.cos(orbit.az) * c,
                      orbit.target.y + orbit.dist * Math.sin(orbit.el),
                      orbit.target.z + orbit.dist * Math.sin(orbit.az) * c);
  camera.lookAt(orbit.target);
}
function resize() {
  const r = $('#stage').getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  const was = camera.aspect;
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  if (Math.abs((was || 0) - camera.aspect) > .01) { framed = null; drawWorld(paint._h); }
}
addEventListener('resize', resize);
let last = 0;
(function tick(now) {
  const dt = Math.min(.05, ((now || 0) - last) / 1000); last = now || 0;
  if (spin) orbit.az += dt * .1;
  placeCamera(); renderer.render(scene, camera); requestAnimationFrame(tick);
})();

// ------------------------------------------------------------------ loading
function curtain(msg) { const b = $('#boot'); if (!b) return;
  b.style.display = msg ? 'grid' : 'none'; if (msg) b.textContent = msg; }

function open(t, { autoplay = false } = {}) {
  trace = t; msgs = thread(t); at = 0; framed = null; paint._h = undefined; spin = true;
  $('#refimg').src = t.reference || '';
  $('#refname').textContent = t.reference_name || 'reference';
  $('#seek').max = String(msgs.length - 1);
  resize(); paint(); $('#thread').scrollTop = 0;
  if (autoplay) setTimeout(play, 700);
}

$('#pick').onchange = async e => {
  stop(); const f = e.target.value; if (!f) return;
  curtain('reading the trace…');
  try { const t = await (await fetch('assets/traces/' + f)).json(); curtain(null); open(t, { autoplay: true }); }
  catch (err) { curtain('could not read that trace: ' + ((err && err.message) || err)); }
};
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; stop();
  try {
    const t = JSON.parse(await f.text());
    if (t.format !== 'OPERATIVE_BUILDER_TRACE_V1') throw new Error('not an OPERATIVE_BUILDER_TRACE_V1 file');
    open(t, { autoplay: true });
  } catch (err) { alert('could not read that trace: ' + err.message); }
};

function renderDocs() {
  $('#docsBody').innerHTML = `
  <h2>How to read this</h2>
  <p>A trace is the complete record of one argument. A reference photograph is pinned.
  A <b>builder</b> may answer only in JSON operations on a world of primitives. A
  <b>critic</b> is told the building is fucked until proven otherwise, is shown the
  render against that reference, and returns a suck score and one concrete accusation.
  The accusation becomes the builder's next prompt. That is the whole loop.</p>
  <p>It is a <em>suck</em> score, so it falls as the building improves — and zero would
  mean only that this view failed to find a discrepancy, never that the thing is done.</p>

  <h3>Why this reads shorter than the file</h3>
  <p>Every accusation is in the raw trace three times: as the critic's verdict, as the
  bridge that carries it across, and again inside the next prompt, wrapped in sixteen
  hundred characters of boilerplate that is identical every cycle. Four logs,
  fifty-four entries, about twenty things actually said. Each is said once here. The
  full prompt is under <em>what it was asked</em> on every builder message, verbatim.</p>

  <h3>The three pictures</h3>
  <p>Each critic message carries what it was actually shown: the render before the
  move, after it, and the geometry diff — cyan added, amber changed, red removed. The
  model above is that same world rebuilt in 3D from the object list the cycle carries,
  ringed where the move touched it. Drag to turn it.</p>

  <h3>Where the loop shows its seams</h3>
  <p>In both castle runs, cycle 1 proposed forty objects and the world rejected every
  one — <b>ADD missing id</b> — so nothing was built. The critic, looking at an empty
  stage, scored it 100 and said so, and the builder rebuilt from that. The six-cycle
  run also lost its connection and retried six times, which is why its last cycle is
  numbered 12.</p>

  <h3>The file</h3>
  <pre>{
  "format": "OPERATIVE_BUILDER_TRACE_V1",
  "intent": "Castle",
  "reference": "data:image/…",
  "model": "gpt-5.6-sol",
  "current_world": [ {id, primitive, role, position, size, rotation_y, color, material, scale} ],
  "history": [ {
    cycle, worldVersion, summary,
    operations, receipts,
    beforeWorld, afterWorld,
    diff: {added, changed, removed},
    beforeShot, afterShot, diffShot,
    critiques: [ {view, score, criticism} ]
  } ],
  "builder_log", "critic_log", "events"
}</pre>

  <h3>Making your own</h3>
  <p>Run <a href="operative-builder-scan.html">the operative builder</a>, pin a
  reference, let the loop go, then export. Drop the file on <b>Open a trace</b> and it
  plays here. Nothing is uploaded and no key is needed to read one.</p>`;
}

(async () => {
  try {
    idx = await (await fetch('assets/traces/index.json')).json();
    $('#pick').innerHTML = idx.traces.map(t =>
      `<option value="${t.file}">${t.intent} · ${t.cycles} cycles · ${t.note}</option>`).join('');
    renderDocs();
    const t = await (await fetch('assets/traces/' + idx.traces[0].file)).json();
    curtain(null);
    open(t, { autoplay: true });
  } catch (e) { curtain('could not read the traces: ' + ((e && e.message) || e)); }
})();
</script>
</body>
