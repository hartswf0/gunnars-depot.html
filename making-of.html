<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Making Of — Gunnar's Depot</title>
<link rel="icon" href="assets/branding/favicon.svg">
<style>
  :root{ --bg:#0d1014; --ink:#e8edf3; --dim:#8b97a6; --line:#1e2732; --safe-b:env(safe-area-inset-bottom,0px);
         --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  #head{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;
    background:linear-gradient(#0d1014f5,#0d1014d0 70%,#0d101400);display:flex;gap:8px;align-items:baseline;
    flex-wrap:wrap;font-size:10px;letter-spacing:.11em;text-transform:uppercase}
  #head b{color:#e8edf3;letter-spacing:.15em}
  #head span{color:var(--dim)}
  #head .k{padding:2px 7px;border-radius:99px;background:#161f2a;color:#9fb0c2}

  #stage{position:fixed;inset:0;top:0;bottom:0;overflow-y:auto;padding:78px 12px 150px;
    display:flex;flex-direction:column;gap:10px}
  #stage > *{flex:0 0 auto}   /* flex children were shrinking the code blocks to one line */
  .badge{display:inline-flex;gap:7px;align-items:center;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;padding:3px 9px;border-radius:99px;align-self:flex-start}
  .orient{background:#12202c;color:#7dd3fc}   .probe{background:#1b1430;color:#c4b5fd}
  .act{background:#241a08;color:#fcd34d}      .verify{background:#0d2c18;color:#86efac}
  .observe{background:#2a1020;color:#f9a8d4}  .record{background:#2a1212;color:#fca5a5}
  .other{background:#1a2029;color:#9fb0c2}

  .say{font-size:15px;line-height:1.5;color:#e8edf3;border-left:2px solid #2f4459;padding:2px 0 2px 12px;
    white-space:pre-wrap}
  h4{margin:8px 0 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5b6a7c;font-weight:600}
  pre{margin:0;font:11.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;
    background:#0f151d;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:#a8b6c6;
    max-height:34vh;overflow:auto}
  pre.cmd{color:#cbd5e1;border-color:#26333f}
  pre.bad{border-color:#5b1d1d;color:#fca5a5}
  img{width:100%;max-width:420px;border-radius:10px;border:1px solid var(--line);display:block}
  .chap{border:1px solid #3b2a08;background:#1a1408;border-radius:10px;padding:10px 12px;color:#fcd34d;
    font-size:12px;white-space:pre-wrap;max-height:26vh;overflow:auto}
  .why{color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .why a{color:#7dd3fc}

  #foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(10px + var(--safe-b));
    background:linear-gradient(#0d101400,#0d1014f5 26%);display:flex;flex-direction:column;gap:8px}
  #track{position:relative;height:22px}
  #scrub{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
  #scrub::-webkit-slider-runnable-track{height:2px;background:#2b3949}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#38bdf8;margin-top:-6.5px;box-shadow:0 0 0 4px rgba(56,189,248,.18)}
  #scrub::-moz-range-track{height:2px;background:#2b3949}
  #scrub::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#38bdf8}
  #ticks{position:absolute;left:0;right:0;top:9px;height:4px;pointer-events:none}
  #ticks i{position:absolute;width:2px;height:8px;background:#fcd34d;top:-2px;border-radius:1px}
  #ticks u{position:absolute;width:2px;height:5px;background:#f9a8d4;top:0;border-radius:1px}
  #bar{display:flex;gap:8px;align-items:center}
  button{background:#16202c;border:1px solid #263445;color:var(--ink);padding:8px 12px;border-radius:9px;
    font-size:12px;font-family:inherit}
  #n{color:var(--dim);font-size:11px;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div id="head"><b>MAKING OF</b><span id="tally">loading&hellip;</span></div>
  <div id="stage"><div class="say">Reading the session record&hellip;</div></div>
  <div id="foot">
    <div id="track"><input id="scrub" type="range" min="0" max="0" value="0" step="1"><div id="ticks"></div></div>
    <div id="bar">
      <button id="play">&#9654;</button>
      <button id="prevShot">&#9664; shot</button>
      <button id="nextShot">shot &#9654;</button>
      <span id="n">&mdash;</span>
    </div>
  </div>

<script type="module">
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

const rec = await (await fetch('data/session-record.json')).json();
const L = rec.loops;
const chapterAt = new Map(rec.chapters.map(c => [c.at, c]));

const c = rec.counts;
$('#tally').textContent =
  `${c.loops} loops · act ${c.act || 0} · verify ${c.verify || 0} · probe ${c.probe || 0} · orient ${c.orient || 0} · looked ${c.observe || 0} · pushed ${c.record || 0}`;

$('#scrub').max = String(L.length - 1);
const ticks = $('#ticks');
for (const ch of rec.chapters) { const t = el('i'); t.style.left = `${(ch.at / (L.length - 1)) * 100}%`; ticks.appendChild(t); }
L.forEach((l, i) => { if (!l.shot) return; const t = el('u'); t.style.left = `${(i / (L.length - 1)) * 100}%`; ticks.appendChild(t); });

let idx = 0, playing = false, timer = null;

function show(i) {
  idx = Math.max(0, Math.min(L.length - 1, i));
  const l = L[idx];
  const s = $('#stage');
  s.innerHTML = '';
  s.scrollTop = 0;

  const ch = chapterAt.get(idx);
  if (ch) { const d = el('div', 'chap', 'INSTRUCTION — ' + ch.text); s.appendChild(d); }

  const when = l.t ? new Date(l.t).toISOString().slice(11, 19) : '';
  const b = el('span', 'badge ' + l.kind, `${l.kind} · ${when} · ${l.tool}`);
  s.appendChild(b);

  if (l.say) s.appendChild(el('div', 'say', l.say));
  if (l.did && l.did !== l.tool) { s.appendChild(el('h4', '', 'what it was for')); s.appendChild(el('pre', 'cmd', l.did)); }
  // an observe loop's "command" is just the file it opened, which the label already said
  if (l.cmd && l.cmd !== l.did) { s.appendChild(el('h4', '', 'what ran')); s.appendChild(el('pre', 'cmd', l.cmd)); }
  if (l.shot) {
    s.appendChild(el('h4', '', 'what it looked like'));
    const img = document.createElement('img'); img.src = l.shot; img.alt = l.did || 'screenshot'; img.loading = 'lazy';
    s.appendChild(img);
  }
  if (l.saw) { s.appendChild(el('h4', '', 'what came back')); s.appendChild(el('pre', l.ok === false ? 'bad' : '', l.saw)); }

  const why = el('div', 'why');
  why.innerHTML = 'The trailer keeps a journal of its 51 moves. This is the journal of the ' + L.length +
    ' moves that produced it — every command and every answer, lifted out of the session and into the repository, ' +
    'because otherwise only the building can prove how it became itself. ' +
    '<a href="ingold-trailer.html">watch the trailer being built &rarr;</a>';
  s.appendChild(why);

  $('#scrub').value = String(idx);
  $('#n').textContent = `${idx + 1} / ${L.length}`;
}

const stop = () => { playing = false; $('#play').innerHTML = '&#9654;'; clearInterval(timer); };
const play = () => {
  playing = true; $('#play').innerHTML = '&#10074;&#10074;'; clearInterval(timer);
  timer = setInterval(() => { if (idx >= L.length - 1) return stop(); show(idx + 1); }, 1400);
};
const jumpShot = (dir) => {
  stop();
  for (let i = idx + dir; i >= 0 && i < L.length; i += dir) if (L[i].shot) return show(i);
};

$('#play').addEventListener('click', () => (playing ? stop() : play()));
$('#scrub').addEventListener('input', (e) => { stop(); show(+e.target.value); });
$('#nextShot').addEventListener('click', () => jumpShot(1));
$('#prevShot').addEventListener('click', () => jumpShot(-1));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { stop(); show(idx + 1); }
  if (e.key === 'ArrowLeft') { stop(); show(idx - 1); }
  if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
});

show(0);
window.making = { rec, show };
</script>
</body>
</html>
