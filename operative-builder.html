<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1014">
<title>Operative Builder — Gunnar's Depot</title>
<link rel="icon" href="assets/branding/favicon.svg">
<style>
  :root{
    --bg:#0d1014; --ink:#e8edf3; --dim:#8b97a6; --line:#1e2732;
    --panel:rgba(14,18,24,.88); --accent:#38bdf8;
    --unsettled:#ef4444; --settling:#f59e0b; --settled:#22c55e;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #viewport{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .status{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:10px;align-items:center;white-space:nowrap;overflow:hidden;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:linear-gradient(#0d1014f2,#0d101400);
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .status{padding-right:196px}
  .status b{padding:3px 8px;border-radius:99px;font-size:10px;letter-spacing:.1em}
  .status.unsettled b{background:#3b1113;color:#fca5a5;box-shadow:inset 0 0 0 1px #7f1d1d}
  .status.settling b{background:#3a2a08;color:#fcd34d;box-shadow:inset 0 0 0 1px #78350f}
  .status.settled  b{background:#0d2c18;color:#86efac;box-shadow:inset 0 0 0 1px #14532d}
  .status .dim{color:var(--dim);font-size:10px}
  .status .dim+.dim:before{content:"";}

  #topRight{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:6;display:flex;gap:6px}
  #topRight .chip{padding:5px 9px}
  #layers{position:fixed;top:calc(env(safe-area-inset-top,0px) + 38px);left:0;right:0;z-index:5;
    display:flex;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
  #layers::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#121821;color:var(--dim);
    padding:5px 10px;border-radius:99px;font-size:11px;font-family:inherit}
  .chip.on{color:var(--ink);border-color:#2f4459;background:#16202c}
  .rulechip{color:#c4b5fd;border-color:#4c1d95;background:#1b1430}

  #dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 10px calc(10px + var(--safe-b));
    background:linear-gradient(#0d101400,#0d1014e8 28%);display:flex;flex-direction:column;gap:8px}
  #log{max-height:27vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:12px}
  .line{background:var(--panel);border:1px solid var(--line);border-left:2px solid #2b3949;
    padding:6px 9px;border-radius:8px;color:#c8d2de;backdrop-filter:blur(8px)}
  .line.said{border-left-color:var(--accent);color:#e8edf3}
  .line.ok{border-left-color:#22c55e}
  .line.good{border-left-color:#22c55e;color:#86efac}
  .line.warn{border-left-color:#f59e0b;color:#fcd34d}
  .line.bad{border-left-color:#ef4444;color:#fca5a5}
  .line.rule{border-left-color:#8b5cf6;color:#c4b5fd}

  #proposal{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #proposal::-webkit-scrollbar{display:none}
  .propose{flex:0 0 auto;border:1px solid #1d4a63;background:#08222e;color:#7dd3fc;
    padding:7px 12px;border-radius:99px;font-size:12px;font-family:inherit}
  .propose:active{background:#0b3346}

  #entry{display:flex;gap:8px;align-items:center}
  #say{flex:1;min-width:0;background:#111820;border:1px solid #263445;color:var(--ink);
    padding:12px 14px;border-radius:12px;font-size:16px;font-family:inherit}
  #say:focus{outline:none;border-color:#38bdf8}
  #send,#undoBtn{background:#16202c;border:1px solid #263445;color:var(--ink);
    padding:12px 13px;border-radius:12px;font-size:13px;font-family:inherit}
  #send{background:#0b3346;border-color:#1d4a63;color:#7dd3fc}

  /* transient readouts: they appear because something is happening, then leave */
  .answer{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:7;
    display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:11px;
    background:rgba(12,16,22,.92);backdrop-filter:blur(10px);border:1px solid #24303e;
    font-size:11px;letter-spacing:.04em;pointer-events:none}
  .answer.clear{border-color:#14532d;box-shadow:0 0 0 1px rgba(34,197,94,.16)}
  .answer.clash{border-color:#7f1d1d;box-shadow:0 0 0 1px rgba(239,68,68,.18)}
  .ans{display:flex;gap:9px;align-items:baseline}
  .ans i{flex:0 0 74px;font-style:normal;color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
  .ans b{font-weight:600;color:#cbd5e1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ans.who b{color:#e8edf3;font-size:12px} .ans.who i{flex:none;order:2;color:#475569;text-transform:none;letter-spacing:0}
  .ans.good b{color:#86efac} .ans.bad b{color:#fca5a5} .ans.warn b{color:#fcd34d}

  .hold{position:fixed;left:50%;transform:translateX(-50%);box-shadow:0 10px 30px rgba(0,0,0,.55);bottom:calc(172px + var(--safe-b));z-index:9;
    border:1px solid #1d4a63;background:#08222e;color:#7dd3fc;padding:12px 22px;border-radius:99px;
    font-size:12px;font-family:inherit;letter-spacing:.14em;overflow:hidden}
  .hold:before{content:"";position:absolute;inset:0;background:#0ea5e9;opacity:.35;
    transform:scaleX(0);transform-origin:left;transition:none}
  .hold.arming:before{transform:scaleX(1);transition:transform .62s linear}

  .ribbon{display:flex;align-items:center;gap:0;padding:6px 2px 10px;flex-wrap:wrap}
  .dot{width:13px;height:13px;border-radius:50%;border:1px solid #475569;background:#1b2530;
    padding:0;flex:0 0 auto}
  .dot.on{background:#a78bfa;border-color:#c4b5fd;box-shadow:0 0 0 3px rgba(167,139,250,.22)}
  .dot.now{background:#38bdf8;border-color:#7dd3fc}
  .dot.now.on{box-shadow:0 0 0 3px rgba(56,189,248,.25)}
  .rail{flex:1 1 14px;min-width:14px;height:1px;background:#334155}

  #sheet{position:fixed;inset:auto 0 0 0;z-index:8;max-height:52vh;transform:translateY(102%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);background:#0f151d;
    border-top:1px solid #24303e;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
  #sheet.open{transform:translateY(0)}
  #sheetHead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #sheetTitle{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9fb0c2;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #closeSheet{background:none;border:none;color:var(--dim);font-size:22px;line-height:1;padding:0 4px}
  #sheetBody{overflow-y:auto;padding:12px 16px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
  #sheetBody h4{margin:12px 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .kv{display:flex;gap:10px;font-size:13px;align-items:baseline}
  .kv i{flex:0 0 84px;font-style:normal;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .kv span{flex:1;color:#dbe4ee}
  .trace,.hist{display:flex;gap:10px;font-size:12px;padding:7px 9px;background:#121a24;border-radius:8px;
    border-left:2px solid #2b3949;flex-wrap:wrap;align-items:baseline}
  .trace i,.hist i{font-style:normal;color:#64748b;font-size:11px;flex:0 0 30px}
  .hist small{flex-basis:100%;color:#64748b;font-size:11px;margin-left:40px}
  .hist small.op{color:#fcd34d} .hist small.cl{color:#86efac}
  .cond{padding:9px 11px;border-radius:9px;background:#141b25;border-left:3px solid #475569;
    display:flex;flex-direction:column;gap:4px}
  .cond b{font-size:10px;letter-spacing:.1em;color:#94a3b8}
  .cond span{font-size:13px;color:#e2e8f0}
  .cond small{font-size:11px;color:#7f8ea0}
  .cond.sev3{border-left-color:var(--unsettled);background:#1c1214}
  .cond.sev2{border-left-color:#f97316;background:#1c1710}
  .cond.sev1{border-left-color:#facc15;background:#1b1a10}
  .row{display:flex;gap:6px;margin-top:2px}
  .mini{background:#1b2530;border:1px solid #2c3a4a;color:#9fb0c2;padding:5px 10px;
    border-radius:7px;font-size:11px;font-family:inherit;align-self:flex-start}
  .mini.go{background:#08222e;border-color:#1d4a63;color:#7dd3fc}
  .dim{color:var(--dim);font-size:12px}
  @media (min-width:900px){ #log{max-height:26vh} #dock{max-width:680px;left:50%;transform:translateX(-50%)} }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div class="status settled" id="status"><b>SETTLED</b></div>
  <div id="topRight">
    <button class="chip on" id="xrayBtn">x-ray</button>
    <button class="chip" id="refBtn" hidden>ref</button>
    <button class="chip" id="historyBtn">history</button>
    <button class="chip" id="helpBtn">?</button>
  </div>
  <div id="layers"></div>

  <div id="dock">
    <div id="log"></div>
    <div id="proposal"></div>
    <div id="entry">
      <input id="say" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
             placeholder="cut a door in the south wall from 20 to 56">
      <button id="undoBtn">undo</button>
      <button id="send">go</button>
    </div>
  </div>

  <div id="answer" class="answer" hidden></div>
  <button id="hold" class="hold" hidden>HOLD TO COMMIT</button>

  <div id="sheet">
    <div id="sheetHead"><div id="sheetTitle"></div><button id="closeSheet">×</button></div>
    <div id="sheetBody"></div>
  </div>

  <script type="module" src="operative/app.js"></script>
</body>
</html>
